name: Set repository topics (one-shot)

on:
  push:
    branches: [main]
    paths: [".github/workflows/set-topics.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Put topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/kkxwz/md2feishu/topics \
            -f 'names[]=feishu' \
            -f 'names[]=lark' \
            -f 'names[]=markdown' \
            -f 'names[]=cli' \
            -f 'names[]=docx' \
            -f 'names[]=wiki' \
            -f 'names[]=sync' \
            -f 'names[]=publishing'
      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/kkxwz/md2feishu/topics
